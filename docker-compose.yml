services:
  restaurant-service:
    build: ./restaurant-service
    ports:
      - "3001:3001"
    environment:
      MENU_SERVICE_URL: http://menu-service:3002

  menu-service:
    build: ./menu-service
    ports:
      - "3002:3002"

  customer-service:
    build: ./customer-service
    ports:
      - "3003:3003"

  order-service:
    build: ./order-service
    ports:
      - "3004:3004"
    environment:
      CUSTOMER_SERVICE_URL: http://customer-service:3003
      RESTAURANT_SERVICE_URL: http://restaurant-service:3001
      MENU_SERVICE_URL: http://menu-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3005
      DELIVERY_SERVICE_URL: http://delivery-service:3006

  payment-service:
    build: ./payment-service
    ports:
      - "3005:3005"
    environment:
      ORDER_SERVICE_URL: http://order-service:3004

  delivery-service:
    build: ./delivery-service
    ports:
      - "3006:3006"
    environment:
      ORDER_SERVICE_URL: http://order-service:3004

  notification-service:
    build: ./notification-service
    ports:
      - "3007:3007"
    environment:
      CUSTOMER_SERVICE_URL: http://customer-service:3003

  auth-service:
    build: ./auth-service
    ports:
      - "3008:3008"
    environment:
      CUSTOMER_SERVICE_URL: http://customer-service:3003
